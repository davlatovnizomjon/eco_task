name: eco_task
description: "Eco jamoasi vazifalar dasturi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  flutter_bounce: ^1.1.0
  table_calendar: ^3.1.2

  go_router: ^16.3.0

  flutter_screenutil: ^5.9.3
  pretty_dio_logger: ^1.4.0

  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.0

  easy_localization: ^3.0.8
  intl: ^0.20.2

  dio: ^5.10.0
  web_socket_channel: ^3.0.1

  equatable: ^2.1.0

  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/translations/

  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
